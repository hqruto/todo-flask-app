<!DOCTYPE html>
<html>
<head>
    <title>編集</title>
</head>
<body>
    <h1>課題を編集</h1>

    <form action="/update/{{ task.id }}" method="POST">
        <label>教科</label>
        <input type="text" name="subject" value="{{ task.subject }}" required>

        <label>内容</label>
        <input type="text" name="task" value="{{ task.content }}" required>

        <label>締切日</label>
        <input type="date" name="deadline" value="{{ task.deadline }}" required>

        <button type="submit">保存</button>
    </form>

    <a href="/">戻る</a>
</body>
</html>
